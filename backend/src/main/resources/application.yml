server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: pib-lms
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pib_lms}
      auto-index-creation: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
  servlet:
    multipart:
      # must not be below lms.files.max-bytes, or Spring rejects the upload
      # before FileService can give a useful message
      max-file-size: 25MB
      max-request-size: 30MB

lms:
  jwt:
    secret: ${JWT_SECRET:pib-lms-development-secret-key-change-me-please-32b}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  mail:
    from: ${MAIL_FROM:no-reply@proitbridge.com}
    enabled: ${MAIL_ENABLED:false}       # false = write to mail_log only
  app:
    base-url: ${LMS_BASE_URL:http://localhost:5173}
    # empty on purpose: the walkthrough is set under Settings, and a
    # plausible-looking default would ship a dead link nobody notices
    walkthrough-url: ${LMS_WALKTHROUGH_URL:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  at-risk:
    no-login-days: 7
  video:
    provider: ${VIDEO_PROVIDER:YOUTUBE}          # YOUTUBE | CLOUDFLARE_STREAM
    cloudflare:
      customer-code: ${CF_CUSTOMER_CODE:}
      key-id: ${CF_STREAM_KEY_ID:}
      private-key: ${CF_STREAM_PRIVATE_KEY:}     # base64 of the PEM
  auth:
    # per account: how many failures before the door shuts, and for how long
    max-per-account: ${AUTH_MAX_PER_ACCOUNT:5}
    lock-minutes: ${AUTH_LOCK_MINUTES:15}
    # per address: stops one machine sweeping many accounts
    max-per-ip: ${AUTH_MAX_PER_IP:20}
    ip-window-minutes: ${AUTH_IP_WINDOW:1}
    reset-ttl-minutes: ${AUTH_RESET_TTL:60}
    max-resets-per-hour: ${AUTH_MAX_RESETS:3}
    
    reset-ttl-minutes: ${AUTH_RESET_TTL:60}
    max-resets-per-hour: ${AUTH_MAX_RESETS:3}
  meeting:
    open-before-minutes: 10
  meeting:
    open-before-minutes: 10
    open-after-minutes: 15
  ai:
    enabled: ${AI_ENABLED:true}
    ollama:
      url: ${OLLAMA_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.1}
      timeout-seconds: ${OLLAMA_TIMEOUT:20}
  import:
    # A folder the server watches for the record sheet. Empty switches the poller off,
    # which is the default: an admin uploads on the Import page instead. Point it at a
    # synced folder and new rows become accounts on their own.
    watch-dir: ${IMPORT_WATCH_DIR:}
    watch-seconds: ${IMPORT_WATCH_SECONDS:300}
    # credential mail for accounts the watcher makes. Off until you mean it.
    watch-mail: ${IMPORT_WATCH_MAIL:false}

  files:
    provider: ${FILES_PROVIDER:LOCAL}          # LOCAL today; S3 is one class away
    dir: ${FILES_DIR:./data/files}
    max-bytes: ${FILES_MAX_BYTES:26214400}     # 25 MB
  bootstrap:
    # the one account a fresh database gets; it must change its password on first use
    email: ${BOOTSTRAP_EMAIL:}
    password: ${BOOTSTRAP_PASSWORD:change-me-on-first-sign-in}
    name: ${BOOTSTRAP_NAME:Super admin}

logging:
  level:
    com.proitbridge.lms: INFO
